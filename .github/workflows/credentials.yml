name: Credential compatibility
on:
  push:
  pull_request:
jobs:
  credentials:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mods/subscriptions/test/python.test.js mods/subscriptions/test/credentials.test.js
